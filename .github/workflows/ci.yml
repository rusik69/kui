name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1

      # cmd/kui depends on webview_go (cgo). Both `go build ./...` and
      # `go vet ./...` compile its C preamble regardless of whether the
      # binary is ever run, so these headers are needed even just to vet.
      - name: Install webview build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install UI test dependencies
        run: npm ci

      - name: Install Chromium and browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Install WebKit and browser dependencies
        run: npx playwright install --with-deps webkit

      - name: ci
        run: make ci
      - name: UI tests (Chromium)
        run: make test-ui
      - name: UI tests (WebKit)
        run: npm run test:ui
        env:
          KUI_BROWSER: webkit
      - name: Summarize package coverage
        if: always()
        run: |
          if [ -f coverage.out ]; then
            go tool cover -func=coverage.out > coverage.txt
          fi

      - name: Publish package coverage
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: package-coverage
          path: |
            coverage.out
            coverage.txt
          if-no-files-found: warn
