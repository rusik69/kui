name: Release binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload binaries for
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            asset: kui-linux-amd64
          - runner: ubuntu-22.04-arm
            asset: kui-linux-arm64
          - runner: macos-15-intel
            asset: kui-darwin-amd64
          - runner: macos-14
            asset: kui-darwin-arm64
          - runner: windows-2022
            asset: kui-windows-amd64.exe
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux webview build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Build executable and checksum
        shell: bash
        run: |
          go build -trimpath -o "${{ matrix.asset }}" ./cmd/kui
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
          if-no-files-found: error

  publish:
    name: Verify and publish release assets
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0

      - name: Verify checked-out commit matches release tag
        shell: bash
        run: |
          test -n "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify complete asset set and checksums
        shell: bash
        run: |
          cd dist
          expected=(
            kui-linux-amd64
            kui-linux-arm64
            kui-darwin-amd64
            kui-darwin-arm64
            kui-windows-amd64.exe
          )
          for asset in "${expected[@]}"; do
            test -s "$asset"
            test -s "$asset.sha256"
            sha256sum --check "$asset.sha256"
          done
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq "$(( ${#expected[@]} * 2 ))"

      - name: Publish all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
