name: Release binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload binaries for
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            asset: kui-linux-amd64
          - runner: ubuntu-22.04-arm
            asset: kui-linux-arm64
          - runner: macos-15-intel
            asset: kui-darwin-amd64
          - runner: macos-14
            asset: kui-darwin-arm64
          - runner: windows-2022
            asset: kui-windows-amd64.exe
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux webview build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Build executable
        shell: bash
        run: go build -trimpath -o "${{ matrix.asset }}" ./cmd/kui

      - name: Attach executable to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" "${{ matrix.asset }}" --repo "$GITHUB_REPOSITORY" --clobber
